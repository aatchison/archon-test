name: opencode-task
description: |
  Run a mechanical coding task using a local model via opencode.

  DEFAULT: Use Gemma for ALL tasks with clear specs. This is the default, not the exception.
  Claude handles only: architecture decisions, multi-file debugging, code quality reviews.
  Everything else — file creation, tests, test fixes, docs, PR descriptions — goes to Gemma first.

  Triggers: "opencode task", "use local model", "run with gemma", "cheap subagent", any mechanical task.
  NOT for: architecture decisions, multi-file coordination requiring judgment.

  Parallel dispatch: For independent tasks, run simultaneously:
    .archon/scripts/run-opencode.sh ... "task A" &
    .archon/scripts/run-opencode.sh ... "task B" &
    wait

  Devcontainer mode (--devcontainer flag):
  - Use when the task needs project dependencies (bun, prisma, node_modules)
  - Requires: opencode config mounted at /root/.config/opencode (see devcontainer.json mounts)
  - The devcontainer workspace is a bind mount — files on the host's current branch are visible
  - IMPORTANT: Provide full code inline in prompts, don't reference plan files by path
    (Gemma has no context of prior conversations or plan documents)

nodes:
  - id: check-opencode
    bash: |
      which opencode >/dev/null 2>&1 && echo "available=true" || echo "available=false"
      opencode models 2>/dev/null | grep -q "vllm-31b/google/gemma-4-31B-it" && echo "model=vllm-31b/google/gemma-4-31B-it" || echo "model=none"

  - id: classify
    prompt: |
      Decide whether the task is suitable for a local model or needs Claude.

      Task: $ARGUMENTS
      opencode state: $check-opencode.output

      A task is suitable for local model if:
      - It touches 1-2 files with a complete, unambiguous spec
      - No architectural judgment is needed
      - The output is mechanical (file creation, config edit, scaffolding)

      A task needs Claude if:
      - It requires understanding context across many files
      - It involves debugging or unexpected behavior
      - It needs architectural decisions

      Output JSON: { "suitable": true|false, "reason": "...", "model": "vllm-31b/google/gemma-4-31B-it" or "claude" }
    depends_on: [check-opencode]
    model: haiku
    allowed_tools: []
    output_format:
      type: object
      properties:
        suitable:
          type: boolean
        reason:
          type: string
        model:
          type: string
      required: [suitable, reason, model]

  - id: run-opencode
    bash: |
      # Activity-based watchdog: kills and retries if output goes idle
      # Use --devcontainer when task needs project deps (bun, prisma, etc.)
      DEVCONTAINER_FLAG=""
      if echo "$ARGUMENTS" | grep -qi '\-\-devcontainer'; then
        DEVCONTAINER_FLAG="--devcontainer"
        # Strip --devcontainer from arguments before passing to opencode
        CLEAN_ARGS=$(echo "$ARGUMENTS" | sed 's/--devcontainer//g')
      else
        CLEAN_ARGS="$ARGUMENTS"
      fi
      .archon/scripts/run-opencode.sh \
        $DEVCONTAINER_FLAG \
        vllm-31b/google/gemma-4-31B-it \
        120 \
        2 \
        "$CLEAN_ARGS"
    depends_on: [classify]
    when: "$classify.output.suitable == true"
    timeout: 600000

  - id: run-claude
    prompt: |
      The task was routed to Claude because: $classify.output.reason

      Task: $ARGUMENTS

      Please complete the task.
    depends_on: [classify]
    when: "$classify.output.suitable == false"

  - id: summarize
    prompt: |
      Summarize what was done.

      Task: $ARGUMENTS
      Routed to: $classify.output.model
      Reason: $classify.output.reason
      opencode output: $run-opencode.output
      Claude output: $run-claude.output

      Be concise. State what was implemented and any files changed.

      IMPORTANT: After this task, update docs/token-usage.md with a row for this task
      including the model used, approximate token count, execution time, and notes.
    depends_on: [run-opencode, run-claude]
    trigger_rule: all_done
    allowed_tools: []
