name: watch-pr-review
description: |
  Watch a PR for review comments, address them, reply, and resolve conversations.
  Polls every 60 seconds for new comments. Auto-start when moving a PR out of draft.
  For each unresolved comment:
  1. Read the comment and understand the feedback
  2. Make the requested code change (if applicable)
  3. Reply to the comment explaining what was done
  4. Resolve the conversation thread
  Triggers: "watch pr", "monitor pr review", "address pr comments"

nodes:
  - id: parse-args
    prompt: |
      Extract the PR number from the arguments.
      Arguments: $ARGUMENTS

      Output JSON: { "pr_number": <number> }
      If no PR number is given, detect from the current branch.
    model: haiku
    allowed_tools: []
    output_format:
      type: object
      properties:
        pr_number:
          type: integer
      required: [pr_number]

  - id: check-pr-state
    bash: |
      PR=${{ $parse-args.output.pr_number }}
      STATE=$(gh pr view "$PR" --json state --jq .state 2>/dev/null)
      echo "state=$STATE"
      if [ "$STATE" = "MERGED" ] || [ "$STATE" = "CLOSED" ]; then
        echo "stop=true"
        echo "reason=PR is $STATE — no need to poll"
      else
        echo "stop=false"
      fi
    depends_on: [parse-args]

  - id: fetch-comments
    bash: |
      PR=${{ $parse-args.output.pr_number }}
      echo "=== PR Review Comments ==="
      gh api repos/{owner}/{repo}/pulls/$PR/comments \
        --jq '.[] | {id: .id, path: .path, line: .line, body: .body, user: .user.login, in_reply_to_id: .in_reply_to_id, created_at: .created_at}' 2>&1
      echo ""
      echo "=== PR Issue Comments ==="
      gh api repos/{owner}/{repo}/issues/$PR/comments \
        --jq '.[] | {id: .id, body: .body, user: .user.login, created_at: .created_at}' 2>&1
      echo ""
      echo "=== PR Reviews ==="
      gh api repos/{owner}/{repo}/pulls/$PR/reviews \
        --jq '.[] | {id: .id, state: .state, body: .body, user: .user.login}' 2>&1
    depends_on: [check-pr-state]
    when: "$check-pr-state.output.stop != 'true'"

  - id: address-comments
    prompt: |
      Review the PR comments below and address each one that needs action.

      PR: #${{ $parse-args.output.pr_number }}
      Comments:
      ${{ $fetch-comments.output }}

      For each unresolved comment that needs a code change or response:
      1. Understand the feedback
      2. If it requires a code change, make the change
      3. Reply and resolve the thread using the helper script:
         .archon/scripts/resolve-pr-threads.sh <pr_number> <comment_id> "<reply explaining what was done>"
      4. IMPORTANT: Always resolve after replying. Unresolved threads signal outstanding feedback.

      If there are no comments to address, say "No pending comments."
      After addressing all comments, commit any changes and push.
    depends_on: [fetch-comments]
    allowed_tools:
      - bash
      - read
      - edit
      - write
      - glob
      - grep

  - id: summarize
    prompt: |
      Summarize what was done for PR #${{ $parse-args.output.pr_number }}.

      PR state: ${{ $check-pr-state.output }}
      Comments found and addressed:
      ${{ $address-comments.output }}

      Be concise — list which comments were addressed and what changes were made.
      If the PR is MERGED or CLOSED, state that polling should stop.

      IMPORTANT: Update docs/token-usage.md with token usage for addressing these comments.
    depends_on: [address-comments, check-pr-state]
    trigger_rule: all_done
    allowed_tools: []
